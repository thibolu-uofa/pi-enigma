[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-enigma"
version = "0.1.0.dev0"          # "working toward 0.1.0"
description = "A Raspberry Pi Enigma machine for teaching"
requires-python = ">=3.11"
dependencies = []               # runtime packages (none yet)

[project.optional-dependencies]
dev = ["pytest"]                # tools only needed while developing

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
